<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Role Requests | Applied AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --subtle:#F9FAFB; --hover:#F3F4F6;
  --border:#E5E7EB; --border-2:#D1D5DB;
  --text:#181818; --text-2:#4B5563; --text-3:#8A919E;
  --primary:#115EE4; --primary-h:#0B4CC0; --primary-soft:#EEF4FE; --primary-ring:rgba(17,94,228,.18);
  --blue-t:#1E4FB8; --blue-b:#EEF4FE;
  --green-t:#167A3E; --green-b:#E9F8EF; --green-d:#22A855;
  --amber-t:#9A5B00; --amber-b:#FFF6E0; --amber-d:#E39B0B;
  --red-t:#B42318; --red-b:#FEF0EF; --red-d:#E5484D;
  --grey-t:#4B5563; --grey-b:#F1F2F4;
  --side:#181818; --side-2:#232323; --side-t:#A3A3A3; --brand-green:#57D873;
  --r:10px; --r-lg:12px;
  --sh:0 1px 2px rgba(16,24,40,.04);
  --sh-lg:0 12px 32px rgba(16,24,40,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141414; --surface:#1C1C1C; --subtle:#202020; --hover:#262626; --border:#2E2E2E; --border-2:#3A3A3A;
  --text:#F5F5F5; --text-2:#B4B4B4; --text-3:#7D7D7D;
  --primary:#4D8BF5; --primary-h:#6A9DF7; --primary-soft:#1A2640; --primary-ring:rgba(77,139,245,.25);
  --blue-t:#8FB4F9; --blue-b:#1A2640; --green-t:#6FD893; --green-b:#15291D; --amber-t:#F2C063; --amber-b:#2E2412;
  --red-t:#F59A95; --red-b:#331A19; --grey-t:#B4B4B4; --grey-b:#262626; --side:#0F0F0F; --side-2:#1C1C1C;
  --sh:0 1px 2px rgba(0,0,0,.3); --sh-lg:0 12px 32px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1C1C1C; --subtle:#202020; --hover:#262626; --border:#2E2E2E; --border-2:#3A3A3A;
  --text:#F5F5F5; --text-2:#B4B4B4; --text-3:#7D7D7D;
  --primary:#4D8BF5; --primary-h:#6A9DF7; --primary-soft:#1A2640; --primary-ring:rgba(77,139,245,.25);
  --blue-t:#8FB4F9; --blue-b:#1A2640; --green-t:#6FD893; --green-b:#15291D; --amber-t:#F2C063; --amber-b:#2E2412;
  --red-t:#F59A95; --red-b:#331A19; --grey-t:#B4B4B4; --grey-b:#262626; --side:#0F0F0F; --side-2:#1C1C1C;
  --sh:0 1px 2px rgba(0,0,0,.3); --sh-lg:0 12px 32px rgba(0,0,0,.5);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.5 "Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* layout */
.app{display:grid;grid-template-columns:232px 1fr;height:100%}
.side{background:var(--side);display:flex;flex-direction:column;padding:20px 12px 16px;overflow-y:auto}
.brand{padding:4px 10px 22px;border-bottom:1px solid #2A2A2A;margin-bottom:14px}
.brand img{width:128px;display:block}
.brand small{display:block;color:var(--side-t);font-size:12px;margin-top:10px;letter-spacing:.01em}
.navlabel{font-size:11px;color:#6B6B6B;padding:6px 10px;font-weight:600}
.nav{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#C9C9C9;font-weight:500;font-size:13.5px;width:100%}
.nav:hover{background:var(--side-2);color:#fff}
.nav.on{background:var(--side-2);color:#fff}
.nav.on svg{color:var(--brand-green)}
.nav .count{margin-left:auto;background:#2F2F2F;color:#fff;border-radius:6px;font-size:11px;padding:0 7px;font-weight:600;line-height:20px}
.nav.on .count{background:var(--primary)}
.side .spacer{flex:1}
.conn{display:flex;gap:8px;font-size:12px;color:var(--side-t);padding:10px;line-height:1.45;border-top:1px solid #2A2A2A;margin-top:10px}
.conn i{width:7px;height:7px;border-radius:50%;background:#6B6B6B;margin-top:6px;flex:none}
.conn.live i{background:var(--brand-green)}
.reset{all:unset;cursor:pointer;font-size:12px;color:#6B6B6B;padding:2px 10px}
.reset:hover{color:#fff}

main{overflow-y:auto;height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 28px;min-height:60px;flex-wrap:wrap}
.crumbs{font-size:13px;color:var(--text-3);display:flex;gap:6px;align-items:center}
.crumbs b{color:var(--text);font-weight:600}
.topbar .grow{flex:1}
.demo{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:3px 4px 3px 10px;background:var(--subtle)}
.demo span{font-size:12px;color:var(--text-3);white-space:nowrap}
.demo select{border:0;background:transparent;font-weight:600;font-size:13px;padding:4px 2px;cursor:pointer;max-width:240px}
.demo select:focus{outline:none}
.wrap{padding:24px 28px 56px;max-width:1360px;width:100%}
.pagehead{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.pagehead h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.015em}
.pagehead p{margin:4px 0 0;color:var(--text-2)}
.pagehead .grow{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-h)}
.btn-secondary{background:var(--surface);border-color:var(--border-2);color:var(--text)}
.btn-secondary:hover{background:var(--hover)}
.btn-success{background:var(--green-d);color:#fff}
.btn-success:hover{filter:brightness(.94)}
.btn-danger{background:var(--surface);border-color:var(--border-2);color:var(--red-t)}
.btn-danger:hover{background:var(--red-b);border-color:var(--red-d)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--hover);color:var(--text)}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.card-h h2{font-size:14px;font-weight:600;margin:0}
.card-h .grow{flex:1}
.card-h .meta{font-size:12px;color:var(--text-3)}
.card-b{padding:16px 18px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.kpi .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--subtle);border:1px solid var(--border);color:var(--text-2)}
.kpi .ic.warn{background:var(--amber-b);border-color:transparent;color:var(--amber-t)}
.kpi span{font-size:12.5px;color:var(--text-2);font-weight:500}
.kpi b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.25;margin-top:2px}
.kpi em{font-style:normal;font-size:12px;color:var(--text-3)}

/* stage strip */
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:16px;overflow:hidden}
.stage{all:unset;box-sizing:border-box;cursor:pointer;padding:14px 18px 16px;border-right:1px solid var(--border);position:relative}
.stage:last-child{border-right:0}
.stage:hover{background:var(--subtle)}
.stage.sel{background:var(--primary-soft)}
.stage.sel::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--primary)}
.stage .lbl{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);font-weight:500}
.stage .lbl .n{width:18px;height:18px;border-radius:50%;background:var(--grey-b);color:var(--text-2);display:grid;place-items:center;font-size:10.5px;font-weight:700}
.stage b{display:block;font-size:22px;font-weight:600;margin:6px 0 8px}
.stage .track{height:4px;border-radius:4px;background:var(--grey-b);overflow:hidden}
.stage .track i{display:block;height:100%;background:var(--primary);border-radius:4px}
.stage.final .track i{background:var(--green-d)}
.stage .od{position:absolute;right:14px;top:40px;font-size:11px;font-weight:600;color:var(--amber-t);background:var(--amber-b);padding:1px 7px;border-radius:5px}

/* dashboard grid */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.toolbar{display:flex;gap:10px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.seg{display:inline-flex;background:var(--grey-b);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 10px;font-size:12.5px;font-weight:500;color:var(--text-2);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.seg button .c{color:var(--text-3);margin-left:4px;font-weight:600}
.searchbox{display:flex;align-items:center;gap:8px;border:1px solid var(--border-2);border-radius:8px;padding:0 10px;height:34px;background:var(--surface);color:var(--text-3);min-width:180px}
.searchbox input{border:0;outline:0;background:transparent;width:100%;color:var(--text)}
.searchbox:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.filterchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--primary-soft);color:var(--blue-t);border:0;border-radius:6px;padding:4px 8px;cursor:pointer}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--text-3);padding:10px 14px;background:var(--subtle);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th:first-child,td:first-child{padding-left:18px}
th:last-child,td:last-child{padding-right:18px}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--subtle)}
.r-title{font-weight:600}
td:first-child{min-width:210px}
td:nth-child(2){white-space:nowrap}
.card-h .meta{white-space:nowrap}
.r-sub{font-size:12px;color:var(--text-3)}
.who{display:flex;align-items:center;gap:9px;min-width:0}
.who .r-sub{white-space:nowrap}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;color:#fff}
.av.lg{width:34px;height:34px;font-size:12px}
.av.sm{width:22px;height:22px;font-size:9.5px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px 2px 8px;border-radius:999px;white-space:nowrap;line-height:20px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.b-blue{background:var(--blue-b);color:var(--blue-t)}
.b-green{background:var(--green-b);color:var(--green-t)}
.b-amber{background:var(--amber-b);color:var(--amber-t)}
.b-red{background:var(--red-b);color:var(--red-t)}
.b-grey{background:var(--grey-b);color:var(--grey-t)}
.age{font-size:13px;color:var(--text-2);white-space:nowrap}
.age.over{color:var(--amber-t);font-weight:600}
.chev{color:var(--text-3)}
.empty{padding:48px 20px;text-align:center;color:var(--text-2)}
.empty .ic{width:44px;height:44px;border-radius:12px;background:var(--subtle);border:1px solid var(--border);display:grid;place-items:center;margin:0 auto 12px;color:var(--text-3)}
.empty b{display:block;color:var(--text);margin-bottom:4px}

.att{display:flex;flex-direction:column}
.att-row{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border)}
.att-row:last-child{border-bottom:0}
.att-row .grow{flex:1;min-width:0}
.att-row .r-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.att-row .r-title:hover{color:var(--primary)}
.feed{list-style:none;margin:0;padding:6px 0}
.feed li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 18px;font-size:13px}
.feed .fi{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.feed .fi svg{width:14px;height:14px}
.fi.blue{background:var(--blue-b);color:var(--blue-t)} .fi.green{background:var(--green-b);color:var(--green-t)} .fi.red{background:var(--red-b);color:var(--red-t)} .fi.amber{background:var(--amber-b);color:var(--amber-t)} .fi.grey{background:var(--grey-b);color:var(--grey-t)}
.feed b{font-weight:600}
.feed .r-sub{display:block}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px}
.bar .t{grid-column:1/-1;height:6px;background:var(--grey-b);border-radius:4px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--primary);border-radius:4px}
.bar b{font-weight:600}

/* form */
.formgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.fsec{padding:20px 22px;border-bottom:1px solid var(--border)}
.fsec:last-of-type{border-bottom:0}
.fsec h3{font-size:14.5px;font-weight:600;margin:0 0 2px}
.fsec>p{margin:0 0 16px;color:var(--text-3);font-size:13px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.f .lab{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.f .req{color:var(--red-d)}
.f .opt{font-weight:400;color:var(--text-3)}
.f input,.f select,.f textarea{border:1px solid var(--border-2);background:var(--surface);border-radius:8px;padding:0 12px;height:38px;width:100%;transition:border-color .12s,box-shadow .12s}
.f textarea{height:auto;min-height:104px;padding:10px 12px;resize:vertical;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--primary);outline:0;box-shadow:0 0 0 3px var(--primary-ring)}
.f .hint{font-size:12px;color:var(--text-3)}
.f .errmsg{display:none;font-size:12px;color:var(--red-t)}
.f.err input,.f.err select,.f.err textarea{border-color:var(--red-d)}
.f.err .errmsg{display:block}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts{position:relative}
.opts input{position:absolute;left:0;top:0;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.opts label{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border-2);border-radius:8px;padding:0 12px;height:36px;cursor:pointer;font-weight:500;font-size:13px;background:var(--surface)}
.opts label::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border-2);box-sizing:border-box;flex:none}
.opts input:checked+label{border-color:var(--primary);background:var(--primary-soft);color:var(--blue-t)}
.opts input:checked+label::before{border:4px solid var(--primary)}
.opts input:focus-visible+label{box-shadow:0 0 0 3px var(--primary-ring)}
.prompts{display:flex;gap:6px;flex-wrap:wrap}
.prompts button{border:1px solid var(--border);background:var(--subtle);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--text-2);display:inline-flex;gap:4px;align-items:center}
.prompts button:hover{border-color:var(--primary);color:var(--primary)}
.pending{font-size:11px;font-weight:600;background:var(--amber-b);color:var(--amber-t);padding:1px 7px;border-radius:5px}
.formfoot{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--border);background:var(--subtle);border-radius:0 0 var(--r-lg) var(--r-lg)}
.aside{position:sticky;top:84px;display:flex;flex-direction:column;gap:16px}
.route{list-style:none;margin:0;padding:0}
.route li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:16px;position:relative}
.route li:not(:last-child)::before{content:"";position:absolute;left:13.5px;top:30px;bottom:2px;width:1px;background:var(--border-2)}
.route .step{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid var(--border-2);background:var(--surface);color:var(--text-2)}
.route .step.sys{background:var(--grey-b);border-color:transparent}
.route b{display:block;font-size:13px;font-weight:600}
.route span{font-size:12px;color:var(--text-3)}
.route .tag{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:600;padding:0 6px;border-radius:4px;background:var(--amber-b);color:var(--amber-t);vertical-align:1px}
.callout{display:flex;gap:10px;font-size:12.5px;color:var(--text-2);background:var(--subtle);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.callout svg{color:var(--text-3);margin-top:2px}
.progress{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-2)}
.progress .t{flex:1;height:6px;background:var(--grey-b);border-radius:4px;overflow:hidden}
.progress .t i{display:block;height:100%;background:var(--green-d);transition:width .2s}
.checks{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px;font-size:12.5px}
.checks li{display:flex;gap:8px;align-items:center;color:var(--text-3)}
.checks li .ck{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border-2);display:grid;place-items:center;flex:none}
.checks li.ok{color:var(--text)}
.checks li.ok .ck{background:var(--green-d);border-color:var(--green-d);color:#fff}
.checks .ck svg{width:10px;height:10px;stroke-width:3}

/* queue */
.qlist{display:flex;flex-direction:column}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:18px 20px;border-bottom:1px solid var(--border);align-items:center}
.qrow:last-child{border-bottom:0}
.qrow .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.qrow h3{font-size:15px;font-weight:600;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--text-2);margin-bottom:8px}
.facts span{display:inline-flex;align-items:center;gap:5px}
.facts svg{width:13px;height:13px;color:var(--text-3)}
.qrow p{margin:0;color:var(--text-2);font-size:13px;max-width:760px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qrow .acts{display:flex;gap:8px}


/* drawer */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);box-shadow:var(--sh-lg);transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;z-index:21;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer{visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
.drawer.on{transform:none;visibility:visible;transition:transform .22s ease}
.dh{padding:18px 24px 16px;border-bottom:1px solid var(--border)}
.dh .row1{display:flex;align-items:center;gap:10px}
.dh .row1 .grow{flex:1}
.dh .id{font-size:12.5px;color:var(--text-3);font-weight:600}
.dh h2{margin:6px 0 6px;font-size:20px;font-weight:600;letter-spacing:-.01em}
.dh .facts{margin:0}
.iconbtn{border:0;background:transparent;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--text-2)}
.iconbtn:hover{background:var(--hover)}
.db{padding:20px 24px 24px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:22px}
.sec h4{font-size:12px;font-weight:600;color:var(--text-3);margin:0 0 10px;letter-spacing:.02em}
.trail{list-style:none;margin:0;padding:0;border:1px solid var(--border);border-radius:var(--r)}
.trail li{display:grid;grid-template-columns:34px 1fr auto;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);align-items:center}
.trail li:last-child{border-bottom:0}
.trail li.cur{background:var(--primary-soft)}
.trail .nm{font-weight:600;font-size:13.5px}
.trail .r-sub em{font-style:normal;color:var(--text-2)}
.trail .note{grid-column:2/-1;font-size:12.5px;color:var(--text-2);background:var(--subtle);border-radius:6px;padding:6px 10px;margin-top:-2px}
.facts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.facts-grid div{padding:10px 14px;border-bottom:1px solid var(--border)}
.facts-grid div:nth-child(odd){border-right:1px solid var(--border)}
.facts-grid div:last-child{border-bottom:0}
.facts-grid span{display:block;font-size:12px;color:var(--text-3)}
.facts-grid b{font-weight:600;font-size:13.5px}
.facts-grid a{color:var(--primary);text-decoration:none;display:inline-flex;gap:5px;align-items:center}
.facts-grid a:hover{text-decoration:underline}
.just{border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;white-space:pre-wrap;color:var(--text);line-height:1.6}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:16px 1fr auto;gap:10px;padding:6px 0;font-size:13px;color:var(--text-2)}
.log li i{width:7px;height:7px;border-radius:50%;background:var(--border-2);margin:7px auto 0}
.log li b{color:var(--text);font-weight:600}
.log small{color:var(--text-3);white-space:nowrap;font-size:12px}
.act{border-top:1px solid var(--border);padding:14px 24px;display:flex;flex-direction:column;gap:10px;background:var(--subtle)}
.act textarea{border:1px solid var(--border-2);background:var(--surface);border-radius:8px;padding:9px 12px;min-height:64px;resize:vertical}
.act textarea:focus{border-color:var(--primary);outline:0;box-shadow:0 0 0 3px var(--primary-ring)}
.act .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.act .row .grow{flex:1}
.act .hintline{font-size:12px;color:var(--text-3);align-self:center}

.toast{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(12px);background:#181818;color:#fff;padding:12px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;max-width:min(420px,90vw);font-weight:500;font-size:13.5px;z-index:30;display:flex;gap:10px;align-items:center;box-shadow:var(--sh-lg)}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand-green);flex:none}
.toast.on{opacity:1;transform:none}
.loading{padding:80px 0;text-align:center;color:var(--text-3)}


/* approval matrix */
.srcbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--text-2)}
.srcbar .grow{flex:1;min-width:240px}
.srcbar b{color:var(--text);font-weight:600}
.srcbar .dot{width:8px;height:8px;border-radius:50%;background:var(--amber-d);flex:none}
.srcbar.live .dot{background:var(--green-d)} .srcbar.err .dot{background:var(--red-d)}
.srcbar .sep{width:1px;height:20px;background:var(--border)}
#gsiBtn{min-height:32px}
.editbar{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:14px;position:sticky;top:68px;z-index:4;border-color:var(--primary);background:var(--primary-soft)}
.editbar .grow{flex:1}
.issues{margin-bottom:14px;border-color:var(--amber-d)}
.issues .card-h{color:var(--amber-t)} .issues .card-h h2{color:var(--amber-t)}
.issues ul{margin:0;padding:10px 18px 12px 36px;font-size:13px;color:var(--text-2)}
.issues li{padding:2px 0}
.linkbtn{all:unset;cursor:pointer;color:var(--primary)} .linkbtn:hover{text-decoration:underline}
.mxcard .tablewrap{max-height:calc(100vh - 260px);overflow:auto}
table.mxg{min-width:0;width:max-content;border-collapse:separate;border-spacing:0}
.mxg th,.mxg td{padding:8px 10px;vertical-align:top;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.mxg td:first-child,.mxg th:first-child{min-width:0}
.mxg td:nth-child(2){white-space:normal}
.mxg thead th{position:sticky;top:0;z-index:2;white-space:normal;width:150px;min-width:150px;max-width:170px;line-height:1.35;vertical-align:bottom}
.mxg thead th span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mxg th.lv{position:sticky;left:0;z-index:1;background:var(--surface);min-width:150px;width:150px}
.mxg thead th.lv{z-index:3;background:var(--subtle)}
.lvb{display:flex;flex-direction:column;text-align:left;gap:1px}
.lvb b{font-size:13.5px;color:var(--text)} .lvb span{font-size:12.5px;color:var(--text-2);font-weight:500} .lvb small{font-size:11px;color:var(--text-3);font-weight:400}
.hbtn{all:unset;cursor:pointer;display:block;border-radius:6px;padding:2px 4px;margin:-2px -4px;color:inherit}
.hbtn:hover{background:var(--hover);color:var(--primary)}
.hbtn.lvb{display:flex;flex-direction:column}
.hbtn:focus-visible,.cellbtn:focus-visible{outline:2px solid var(--primary)}
.cellbtn{all:unset;cursor:pointer;display:block;width:100%;min-height:28px;border-radius:6px;padding:2px;margin:-2px;box-sizing:border-box}
.cellbtn:hover{background:var(--primary-soft)}
.aps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.aps li{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text);white-space:nowrap}
.aps li+li{position:relative}
.aps .flag svg{width:13px;height:13px;color:var(--red-d)}
.ap.none{font-size:12px;color:var(--red-t)}
.av.xs{width:18px;height:18px;font-size:8px}
.mxg td.chg,.mxg th.chg{background:var(--amber-b)}
.mxg td.bad{background:var(--red-b)}
.mxfoot{display:flex;gap:8px;align-items:center;padding:10px 16px}
.mxlog{list-style:none;margin:0;padding:0}
.mxlog li{padding:12px 18px;border-bottom:1px solid var(--border)} .mxlog li:last-child{border-bottom:0}
.mxlog li div{display:flex;gap:10px;align-items:baseline} .mxlog small{color:var(--text-3);font-size:12px}
.mxlog pre{margin:4px 0 0;font:12.5px/1.5 inherit;font-family:inherit;color:var(--text-2);white-space:pre-wrap}
.aplist{display:flex;flex-direction:column;gap:10px}
.aprow{display:flex;align-items:flex-start;gap:6px}
.aprow .grow{flex:1;min-width:0}
.aprow input{width:100%;border:1px solid var(--border-2);background:var(--surface);border-radius:8px;height:36px;padding:0 10px}
.aprow input:focus,.f input:focus{border-color:var(--primary);outline:0;box-shadow:0 0 0 3px var(--primary-ring)}
.stepn{width:26px;height:26px;margin-top:5px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid var(--border-2);flex:none;color:var(--text-2)}
.aphint{font-size:12px;color:var(--text-3);margin-top:3px} .aphint.bad{color:var(--red-t)}
.iconbtn[disabled]{opacity:.35;pointer-events:none}
svg.up{transform:rotate(-90deg)} svg.down{transform:rotate(90deg)}
.drawer details{border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:8px}
.drawer summary{cursor:pointer;font-weight:600;font-size:13px}
.ckgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin-top:10px}
.ck2{display:flex;gap:8px;align-items:center;font-size:13px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.drawer .f{display:flex;flex-direction:column;gap:6px}
.callout.warn{background:var(--amber-b);border-color:var(--amber-d);color:var(--amber-t)} .callout.warn svg{color:var(--amber-t)}
.chglist{margin:0;padding-left:18px;font-size:13px;color:var(--text-2);display:flex;flex-direction:column;gap:6px}
@media (max-width:860px){.editbar{top:0}.ckgrid{grid-template-columns:1fr}.mxcard .tablewrap{max-height:none}}

.mnav{display:none}
@media (max-width:1180px){.grid2,.formgrid{grid-template-columns:1fr}.aside{position:static}.rules{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mnav{display:flex;gap:4px;overflow-x:auto;padding:8px 16px;background:var(--side)}
  .mnav button{all:unset;cursor:pointer;color:#C9C9C9;padding:7px 12px;border-radius:8px;white-space:nowrap;font-size:13px;font-weight:500}
  .mnav button.on{background:var(--side-2);color:#fff}
  .topbar{padding:10px 16px}
  .crumbs{display:none}
  .wrap{padding:18px 16px 48px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stages{grid-template-columns:repeat(5,minmax(120px,1fr));overflow-x:auto}
  .fields{grid-template-columns:1fr}
  .qrow{grid-template-columns:1fr}
  .facts-grid{grid-template-columns:1fr}
  .facts-grid div{border-right:0!important;border-bottom:1px solid var(--border)!important}
}
</style>
</head>

function activity(list){
  const out=[];
  list.forEach(r=>r.hist.forEach((h,i)=>{
    const t=`<b>${esc(r.title)}</b>`;
    if(h.a==="submitted") out.push({t:h.t,i:"file",c:"blue",html:`${esc(disp(h.who))} raised ${t}`,to:`Emailed talent team and ${r.chain[0].name}`});
    if(h.a==="approved"){const nx=r.chain[r.hist.slice(0,i+1).filter(x=>x.a==="approved").length];
      out.push({t:h.t,i:"check",c:"green",html:`${esc(h.who)} approved ${t}`,to:nx?`Emailed ${nx.name}`:`Emailed talent team to post in HiBob`});}
    if(h.a==="declined") out.push({t:h.t,i:"x",c:"red",html:`${esc(h.who)} declined ${t}`,to:`Emailed ${r.requester} and talent team`});
    if(h.a==="nudged") out.push({t:h.t,i:"bell",c:"amber",html:`Reminder sent for ${t}`,to:`Emailed ${h.note||"approver"}`});
    if(h.a==="posted") out.push({t:h.t,i:"send",c:"grey",html:`${t} is live in HiBob`,to:`Emailed ${r.requester}`});
  }));
  return out.sort((a,b)=>b.t-a.t);
}

/* ---------- approval matrix: data quality, editing, sync ---------- */
const TRACKS=["Executive","Management","Individual Contributor"];
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const cur=()=>S.draft||S.matrix;
function canEditMatrix(){
  if(S.mx.src==="sheet") return !!(S.mx.auth&&S.mx.isAdmin);
  return S.viewer==="HR"&&!S.readOnly;
}
function people(m){const s=new Set(); m.cells.forEach(r=>r.forEach(ch=>ch.forEach(e=>s.add(e)))); return [...s].sort();}
function emailProblem(e){
  if(!EMAIL_RE.test(e)) return "is not a valid email";
  if(e.split("@")[1].toLowerCase()!==CONFIG.DOMAIN) return "is not an @"+CONFIG.DOMAIN+" address";
  return "";
}
function issues(m){
  const out=[];
  const dl=new Set(), dd=new Set();
  m.levels.forEach((l,r)=>{const k=String(l.code).trim().toUpperCase(); if(!k) out.push({r,c:-1,msg:"A level is missing its code"}); else if(dl.has(k)) out.push({r,c:-1,msg:"Level "+k+" appears twice"}); dl.add(k);});
  m.depts.forEach((d,c)=>{const k=String(d).trim().toLowerCase(); if(!k) out.push({r:-1,c,msg:"A department is missing its name"}); else if(dd.has(k)) out.push({r:-1,c,msg:d+" appears twice"}); dd.add(k);});
  m.cells.forEach((row,r)=>row.forEach((ch,c)=>{
    const where=m.levels[r].code+" / "+m.depts[c];
    if(!ch.length) out.push({r,c,msg:where+": no approver"});
    ch.forEach(e=>{const p=emailProblem(e); if(p) out.push({r,c,msg:where+": "+e+" "+p});});
    if(new Set(ch).size!==ch.length) out.push({r,c,msg:where+": the same person appears twice"});
  }));
  return out;
}
/* draft bookkeeping: remember where each draft row/column came from so changes can be described */
function startEdit(){
  S.draft=clone(S.matrix); delete S.draft.log;
  S.dmeta={levelOrig:S.matrix.levels.map(l=>l.code),deptOrig:S.matrix.depts.slice(),ops:[]};
  render();
}
function discardEdit(){S.draft=null;S.dmeta=null;closeDrawer();render();toast("Changes discarded");}
const short=ch=>ch.length?ch.map(nameOf).join(" > "):"nobody";
function origCell(r,c){
  const lo=S.dmeta.levelOrig[r], dO=S.dmeta.deptOrig[c]; if(lo==null||dO==null) return null;
  const li=S.matrix.levels.findIndex(l=>l.code===lo), di=S.matrix.depts.indexOf(dO);
  return li<0||di<0?null:S.matrix.cells[li][di];
}
function cellChanged(r,c){
  if(!S.draft) return false; const o=origCell(r,c);
  return !o||o.join()!==S.draft.cells[r][c].join();
}
function changeList(){
  if(!S.draft) return [];
  const out=S.dmeta.ops.slice();
  S.draft.cells.forEach((row,r)=>row.forEach((ch,c)=>{
    const o=origCell(r,c); if(!o) return;
    if(o.join()!==ch.join()){const sameNames=short(o)===short(ch); out.push(`${S.draft.levels[r].code} / ${S.draft.depts[c]}: ${sameNames?o.join(", "):short(o)} changed to ${sameNames?ch.join(", "):short(ch)}`);}
  }));
  S.draft.levels.forEach((l,r)=>{const lo=S.dmeta.levelOrig[r]; if(lo==null) return; const o=S.matrix.levels.find(x=>x.code===lo);
    if(o&&(o.title!==l.title||o.track!==l.track)&&!out.some(x=>x.startsWith("Level "+lo))) out.push(`Level ${l.code}: details updated to ${l.title}, ${l.track}`);});
  return out;
}

/* ---------- Google Sheet sync ---------- */
async function loadSheetMatrix(quiet){
  S.mx.status="loading"; S.mx.err=""; if(S.view==="matrix") render();
  try{
    const res=await fetch(CONFIG.SHEET_API_URL,{method:"GET"}); const j=await res.json();
    if(!j.ok||!validMatrix(j.matrix)) throw new Error(j.message||j.error||"Unexpected response");
    S.matrix=j.matrix; S.mx.status="ok"; S.mx.syncedAt=Date.now();
    if(!quiet) refresh();
  }catch(e){S.mx.status="error"; S.mx.err=String(e.message||e); refresh();}
}
async function sheetApi(body){
  const res=await fetch(CONFIG.SHEET_API_URL,{method:"POST",body:JSON.stringify(body)});
  return res.json();
}
let gsiLoading=false;
function ensureGsi(){
  if(!CONFIG.GOOGLE_CLIENT_ID||S.mx.src!=="sheet") return;
  if(window.google&&google.accounts&&google.accounts.id){ drawGsiButton(); return; }
  if(gsiLoading) return; gsiLoading=true;
  const sc=document.createElement("script"); sc.src="https://accounts.google.com/gsi/client"; sc.async=true;
  sc.onload=()=>{google.accounts.id.initialize({client_id:CONFIG.GOOGLE_CLIENT_ID,callback:onCredential,hd:CONFIG.DOMAIN,auto_select:true}); drawGsiButton();};
  sc.onerror=()=>{gsiLoading=false; toast("Couldn't load Google sign in.");};
  document.head.appendChild(sc);
}
function drawGsiButton(){const el=$("#gsiBtn"); if(el&&window.google&&!el.childElementCount) google.accounts.id.renderButton(el,{theme:"outline",size:"medium",text:"signin_with",shape:"rectangular"});}
async function onCredential(resp){
  const token=resp.credential; let email="";
  try{email=JSON.parse(atob(token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).email||"";}catch(e){}
  S.mx.auth={token,email}; S.mx.signing=true; render();
  try{
    const j=await sheetApi({action:"whoami",idToken:token});
    if(!j.ok) throw new Error(j.message||j.error);
    S.mx.auth.email=j.email; S.mx.isAdmin=!!j.isAdmin;
    toast(j.isAdmin?"Signed in. You can edit the approval matrix.":"Signed in. You have view-only access to the matrix.");
    loadMatrixLog();
  }catch(e){S.mx.auth=null; S.mx.isAdmin=false; toast("Sign in failed: "+(e.message||e));}
  S.mx.signing=false; render();
}
function signOut(){ if(S.draft) discardEdit(); S.mx.auth=null; S.mx.isAdmin=false; S.mx.log=[]; try{google.accounts.id.disableAutoSelect();}catch(e){} render(); }
async function loadMatrixLog(){
  if(S.mx.src!=="sheet"||!S.mx.auth) return;
  try{const j=await sheetApi({action:"log",idToken:S.mx.auth.token}); if(j.ok){S.mx.log=j.log; if(S.view==="matrix") render();}}catch(e){}
}
async function publish(){
  const m=S.draft, list=changeList();
  if(!list.length){toast("Nothing to publish.");return;}
  if(issues(m).length){toast("Fix the highlighted issues before publishing.");return;}
  const clean={levels:m.levels,depts:m.depts,cells:m.cells};
  if(S.mx.src==="sheet"){
    S.mx.status="saving"; renderPanel();
    let j; try{ j=await sheetApi({action:"save",idToken:S.mx.auth.token,baseVersion:S.matrix.version,matrix:clean,summary:list}); }
    catch(e){ j={ok:false,error:"network",message:String(e.message||e)}; }
    S.mx.status="ok";
    if(!j.ok){
      if(j.error==="conflict"){S.mx.conflict=j.matrix; S.mx.status="conflict"; renderPanel(); render(); return;}
      if(j.error==="unauthenticated"){S.mx.auth=null; S.mx.isAdmin=false; closeDrawer(); render(); toast("Your sign in expired. Sign in again, your edits are kept."); return;}
      toast("Couldn't publish: "+(j.problems?j.problems.slice(0,2).join("; "):(j.message||j.error))); renderPanel(); return;
    }
    S.matrix=j.matrix; S.mx.syncedAt=Date.now(); loadMatrixLog();
  }else{
    S.mx.log=[{when:new Date().toISOString(),who:S.viewer==="HR"?"Talent Acquisition (HR)":S.viewer,changes:list.join("\n")}].concat(S.mx.log).slice(0,50);
    S.matrix=Object.assign(clean,{log:S.mx.log}); saveMatrix();
  }
  S.draft=null; S.dmeta=null; closeDrawer(); render();
  toast(`Published ${list.length} change${list.length>1?"s":""}${S.mx.src==="sheet"?" to the Google Sheet":""}.`);
}

      ${m.cells[r].map((ch,c)=>{const cls=[bad.has(r+":"+c)?"bad":"",cellChanged(r,c)?"chg":""].join(" ");
        return `<td class="${cls}">${ed?`<button class="cellbtn" data-mx="cell" data-r="${r}" data-c="${c}" aria-label="Edit ${esc(l.code)} ${esc(m.depts[c])}">${apList(ch)}</button>`:apList(ch)}</td>`;}).join("")}</tr>`;}).join("");
  const grid=`<div class="card mxcard"><div class="tablewrap"><table class="mxg"><thead><tr><th class="lv">Level</th>${th}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="mxfoot r-sub">${ic("info")}Changes apply to new requests. Requests already in approval keep the route they started with.</div></div>`;
  const log=(S.mx.log||[]).length?`<div class="card" style="margin-top:16px"><div class="card-h"><h2>Change history</h2><div class="grow"></div><span class="meta">${S.mx.src==="sheet"?"From the Matrix Change Log tab":"This portal"}</span></div><ul class="mxlog">${S.mx.log.slice(0,10).map(x=>`<li><div><b>${esc(x.who)}</b><small>${fmt(new Date(x.when).getTime())}</small></div><pre>${esc(x.changes)}</pre></li>`).join("")}</ul></div>`:"";
  return head+srcBar()+bar+issBox+grid+log;
}

      ${isNew?`<div class="f"><label for="pCopy">Start with approvers from</label><select id="pCopy"><option value="-1">Nobody, I'll fill each level</option>${m.depts.map((x,i)=>`<option value="${i}" ${p.copy===i?"selected":""}>${esc(x)}</option>`).join("")}</select></div>`
      :`<div class="f"><span class="lab">Position</span><div class="row-btns"><button class="btn btn-secondary btn-sm" data-mx="dleft" ${p.c===0?"disabled":""}>Move left</button><button class="btn btn-secondary btn-sm" data-mx="dright" ${p.c===m.depts.length-1?"disabled":""}>Move right</button></div></div>
       <div class="f"><span class="lab">Remove</span><div class="hint">Deleting removes this column from the matrix and the Raise a role form. Open requests are not affected.</div><div><button class="btn btn-danger btn-sm" data-mx="ddel">${p.confirm?"Click again to delete":"Delete department"}</button></div></div>`}`,

  if(p.kind==="level"){

    el.innerHTML=panelShell(isNew?"New level":"Level",isNew?"Add a level":`${m.levels[p.r].code}, ${m.levels[p.r].title}`,isNew?"Adds a row to the matrix.":"",

      ${isNew?`<div class="f"><label for="pPos">Place above</label><select id="pPos">${m.levels.map((x,i)=>`<option value="${i}" ${p.pos===i?"selected":""}>${esc(x.code)}, ${esc(x.title)}</option>`).join("")}<option value="${m.levels.length}" ${p.pos===m.levels.length?"selected":""}>At the bottom</option></select></div>
        <div class="f"><label for="pCopy">Copy approvers from</label><select id="pCopy"><option value="-1">Nobody, I'll fill each department</option>${m.levels.map((x,i)=>`<option value="${i}" ${p.copy===i?"selected":""}>${esc(x.code)}, ${esc(x.title)}</option>`).join("")}</select></div>`:""}</div>

function moveArr(a,i,j){const x=a.splice(i,1)[0]; a.splice(j,0,x);}
function mxAction(k,ds){
  const p=S.mxPanel, m=S.draft;
  switch(k){
    case "edit": return startEdit();
    case "discard": return discardEdit();
    case "reload": return loadSheetMatrix();
    case "signout": return signOut();
    case "close": return closeDrawer();
    case "review": return openPanel({kind:"review"});
    case "publish": return publish();
    case "latest": return takeLatest();
    case "cell": if(!m) return; return openPanel({kind:"cell",r:+ds.r,c:+ds.c,chain:m.cells[+ds.r][+ds.c].slice(),alsoL:[],alsoD:[]});
    case "apadd": p.chain.push(""); renderPanel(); { const ins=$("#drawer").querySelectorAll("[data-ap]"); ins[ins.length-1]?.focus(); } return;
    case "aprm": p.chain.splice(+ds.i,1); return renderPanel();
    case "apup": moveArr(p.chain,+ds.i,+ds.i-1); return renderPanel();
    case "apdown": moveArr(p.chain,+ds.i,+ds.i+1); return renderPanel();
    case "cellok": {
      const ch=p.chain.map(e=>e.trim().toLowerCase()).filter(Boolean);
      const bad=ch.find(e=>!EMAIL_RE.test(e)); if(bad){toast(`"${bad}" is not a valid email.`);return;}
      if(!ch.length){toast("Add at least one approver.");return;}
      const targets=[[p.r,p.c]].concat(p.alsoL.map(r=>[r,p.c]),p.alsoD.map(c=>[p.r,c]));
      targets.forEach(([r,c])=>m.cells[r][c]=ch.slice());
      closeDrawer(); render(); toast(targets.length>1?`Updated ${targets.length} cells`:"Cell updated"); return;
    }
    case "adddept": return openPanel({kind:"dept",c:-1,name:"",copy:-1});
    case "dept": return openPanel({kind:"dept",c:+ds.c,name:m.depts[+ds.c],confirm:false});
    case "dleft": case "dright": {
      const j=p.c+(k==="dleft"?-1:1); moveArr(m.depts,p.c,j); m.cells.forEach(row=>moveArr(row,p.c,j)); moveArr(S.dmeta.deptOrig,p.c,j);
      S.dmeta.ops.push(`Moved department ${m.depts[j]} ${k==="dleft"?"left":"right"}`); p.c=j; render(); return renderPanel(); }
    case "ddel": {
      if(!p.confirm){p.confirm=true; return renderPanel();}
      if(m.depts.length<2){toast("The matrix needs at least one department.");return;}
      const name=m.depts[p.c]; m.depts.splice(p.c,1); m.cells.forEach(row=>row.splice(p.c,1)); S.dmeta.deptOrig.splice(p.c,1);
      S.dmeta.ops.push(`Deleted department ${name}`); closeDrawer(); render(); toast(`${name} removed`); return; }
    case "deptok": {
      const name=$("#pName").value.trim(); if(!name){toast("Give the department a name.");return;}
      if(m.depts.some((x,i)=>i!==p.c&&x.toLowerCase()===name.toLowerCase())){toast("That department already exists.");return;}
      if(p.c<0){const cp=+$("#pCopy").value; m.depts.push(name); m.cells.forEach(row=>row.push(cp>=0?row[cp].slice():[])); S.dmeta.deptOrig.push(null);
        S.dmeta.ops.push(`Added department ${name}${cp>=0?` (approvers copied from ${m.depts[cp]})`:""}`);}
      else if(name!==m.depts[p.c]){S.dmeta.ops.push(`Renamed department ${m.depts[p.c]} to ${name}`); m.depts[p.c]=name;}
      closeDrawer(); render(); return; }
    case "addlevel": return openPanel({kind:"level",r:-1,code:"",title:"",track:"Individual Contributor",pos:0,copy:-1});
    case "level": { const l=m.levels[+ds.r]; return openPanel({kind:"level",r:+ds.r,code:l.code,title:l.title,track:l.track,confirm:false}); }
    case "lup": case "ldown": {
      const j=p.r+(k==="lup"?-1:1); [m.levels,m.cells,S.dmeta.levelOrig].forEach(a=>moveArr(a,p.r,j));
      S.dmeta.ops.push(`Moved level ${m.levels[j].code} ${k==="lup"?"up":"down"}`); p.r=j; render(); return renderPanel(); }
    case "ldel": {
      if(!p.confirm){p.confirm=true; return renderPanel();}
      if(m.levels.length<2){toast("The matrix needs at least one level.");return;}
      const code=m.levels[p.r].code; [m.levels,m.cells,S.dmeta.levelOrig].forEach(a=>a.splice(p.r,1));
      S.dmeta.ops.push(`Deleted level ${code}`); closeDrawer(); render(); toast(`Level ${code} removed`); return; }
    case "levelok": {
      const code=$("#pCode").value.trim().toUpperCase(), title=$("#pTitle").value.trim(), track=$("#pTrack").value.trim();
      if(!code||!title){toast("Add a level code and title.");return;}
      if(m.levels.some((x,i)=>i!==p.r&&x.code.toUpperCase()===code)){toast(`Level ${code} already exists.`);return;}
      if(p.r<0){const pos=+$("#pPos").value, cp=+$("#pCopy").value;
        m.levels.splice(pos,0,{code,title,track}); m.cells.splice(pos,0,m.depts.map((_,c)=>cp>=0?m.cells[cp][c].slice():[])); S.dmeta.levelOrig.splice(pos,0,null);
        S.dmeta.ops.push(`Added level ${code}, ${title}`);}
      else{const o=m.levels[p.r]; if(o.code!==code) S.dmeta.ops.push(`Renamed level ${o.code} to ${code}`); Object.assign(o,{code,title,track});}
      closeDrawer(); render(); return; }
  }
}

/* ---------- detail drawer ---------- */
function openDrawer(id){
  const r=S.reqs.find(x=>x.id===id); if(!r) return; S.openId=id; const s=status(r);
  const canAct=s.k==="pending"&&s.who===S.viewer&&!S.readOnly, canPost=s.k==="approved"&&S.viewer==="HR"&&!S.readOnly, canNudge=s.k==="pending"&&(S.viewer==="HR"||S.viewer===r.requester)&&!S.readOnly;
  const appr=r.hist.filter(h=>h.a==="approved"), dec=r.hist.find(h=>h.a==="declined");
  const trail=[{name:r.requester,role:"Requester",state:"done",t:r.hist[0].t,lbl:"Submitted"}];
  r.chain.forEach((c,i)=>{
    if(i<r.stage) trail.push({name:c.name,role:c.role.replace(/ \(.*\)/,""),state:"done",t:appr[i]&&appr[i].t,lbl:"Approved",note:appr[i]&&appr[i].note});
    else if(i===r.stage&&r.declined) trail.push({name:c.name,role:c.role.replace(/ \(.*\)/,""),state:"declined",t:dec&&dec.t,lbl:"Declined",note:dec&&dec.note});
    else if(i===r.stage) trail.push({name:c.name,role:c.role.replace(/ \(.*\)/,""),state:"cur",t:lastT(r),lbl:"Waiting"});
    else trail.push({name:c.name,role:c.role.replace(/ \(.*\)/,""),state:"todo",lbl:"Not started"});
  });
  const post=r.hist.find(h=>h.a==="posted");
  trail.push({name:"HR",role:"Create job in HiBob",state:r.posted?"done":s.k==="approved"?"cur":"todo",t:post?post.t:(s.k==="approved"?lastT(r):null),lbl:r.posted?"Posted":s.k==="approved"?"Waiting":r.declined?"Not needed":"Not started"});
  const stB=x=>x.state==="done"?`<span class="badge b-green">${x.lbl}</span>`:x.state==="declined"?`<span class="badge b-red">${x.lbl}</span>`:x.state==="cur"?`<span class="badge ${isStuck(r)?"b-amber":"b-blue"}">${x.lbl}</span>`:`<span class="r-sub">${x.lbl}</span>`;
  const verb={submitted:"submitted the request",approved:"approved",declined:"declined",nudged:"sent a reminder to",posted:"posted the role in HiBob"};
  const wasOpen=$("#drawer").classList.contains("on");
  $("#drawer").innerHTML=`
  <div class="dh">
    <div class="row1"><span class="id">${esc(r.id)}</span>${badge(r)}<div class="grow"></div><button class="iconbtn" id="closeD" aria-label="Close">${ic("x")}</button></div>
    <h2>${esc(r.title)}</h2>
    <div class="facts"><span>${ic("brief")}${esc(r.dept)}</span><span>${ic("layers")}${esc(r.level)}</span><span>${ic("pin")}${esc(r.loc)}</span><span>${ic("clock")}Raised ${fmt(r.hist[0].t)}</span></div>
  </div>
  <div class="db">
    <div class="sec"><h4>APPROVAL PROGRESS</h4>
      <ol class="trail">${trail.map(x=>`<li class="${x.state==="cur"?"cur":""}">${avatar(x.name,"lg")}<div><div class="nm">${esc(disp(x.name))}</div><div class="r-sub">${esc(x.role)}${x.t&&x.state!=="todo"?` · <em>${x.state==="cur"?"for "+dur(Date.now()-x.t):fmt(x.t)}</em>`:""}</div></div>${stB(x)}${x.note?`<div class="note">"${esc(x.note)}"</div>`:""}</li>`).join("")}</ol>
    </div>
    <div class="sec"><h4>ROLE DETAILS</h4>
      <div class="facts-grid">
        <div><span>Requested by</span><b>${esc(r.requester)}</b></div><div><span>Hiring manager</span><b>${esc(r.manager)}</b></div>
        <div><span>Employment type</span><b>${esc(r.emp)}</b></div><div><span>Role type</span><b>${esc(r.rtype)}</b></div>
        <div><span>Alternatives considered</span><b>${esc(r.alt)}</b></div><div><span>Budget</span><b>${esc(r.budget||"Not provided")}</b></div>
        <div style="grid-column:1/-1;border-right:0"><span>Job description</span><b>${/^https?:\/\//.test(r.jd||"")?`<a href="${esc(r.jd)}" target="_blank" rel="noopener">Open Google Doc ${ic("ext")}</a>`:"Not attached"}</b></div>
      </div>
    </div>
    <div class="sec"><h4>BUSINESS JUSTIFICATION</h4><div class="just">${esc(r.just)}</div></div>
    <div class="sec"><h4>ACTIVITY LOG</h4>
      <ul class="log">${r.hist.slice().reverse().map(h=>`<li><i></i><span><b>${esc(disp(h.who))}</b> ${verb[h.a]||esc(h.a)}${h.a==="nudged"?` <b>${esc(h.note||"approver")}</b>`:""}</span><small>${fmt(h.t)}</small></li>`).join("")}</ul>
    </div>
  </div>
  ${canAct||canPost||canNudge?`<div class="act">
    ${canAct?`<textarea id="note" placeholder="Add a comment. Required if you decline." aria-label="Comment"></textarea><div class="row"><span class="hintline grow">Your decision is emailed to the requester and the talent team.</span><button class="btn btn-danger" data-decline="${r.id}">${ic("x")}Decline</button><button class="btn btn-success" data-approve="${r.id}">${ic("check")}Approve</button></div>`:""}
    ${canPost?`<div class="row"><span class="hintline grow">Create the job in HiBob first, then mark it live here.</span><button class="btn btn-success" data-post="${r.id}">${ic("check")}Mark as live in HiBob</button></div>`:""}
    ${canNudge&&!canAct?`<div class="row"><span class="hintline grow">Waiting on ${esc(s.who)} for ${dur(Date.now()-lastT(r))}.</span><button class="btn btn-secondary" data-nudge="${r.id}">${ic("bell")}Send reminder</button></div>`:""}
  </div>`:""}`;
  $("#drawer").classList.add("on"); $("#scrim").classList.add("on"); if(!wasOpen) $("#closeD").focus();
}
function closeDrawer(){S.openId=null;S.mxPanel=null;$("#drawer").classList.remove("on");$("#scrim").classList.remove("on");}

function act(kind,id){
  if(S.readOnly){toast("You have view-only access.");return;}
  const r=S.reqs.find(x=>x.id===id); if(!r) return; const s=status(r); const note=($("#note")?.value||"").trim();
  if(kind==="approve"){r.hist.push(Object.assign({t:Date.now(),who:S.viewer,a:"approved"},note?{note}:{})); r.stage++;
    const nx=r.chain[r.stage]; toast(nx?`Approved. ${nx.name} has been notified.`:`Fully approved. The talent team has been asked to post it in HiBob.`);}
  if(kind==="decline"){ if(!note){toast("Add a comment so the requester knows why.");$("#note").focus();return;}
    r.hist.push({t:Date.now(),who:S.viewer,a:"declined",note}); r.declined=true; toast(`Declined. ${r.requester} and the talent team have been notified.`);}
  if(kind==="post"){r.hist.push({t:Date.now(),who:"HR",a:"posted"}); r.posted=true; toast(`Marked as live. ${r.requester} has been notified.`);}
  if(kind==="nudge"){r.hist.push({t:Date.now(),who:S.viewer,a:"nudged",note:s.who}); toast(`Reminder sent to ${s.who}.`);}
  if($("#note")) $("#note").value="";
  saveReq(r); render(); if($("#drawer").classList.contains("on")) openDrawer(id);
}

/* ---------- render ---------- */
function render(){
  renderChrome();
  const v=$("#view");
  if(!S.loaded){v.innerHTML=`<div class="loading">Loading requests</div>`;return;}
  v.innerHTML=S.view==="dash"?dash():S.view==="new"?form():S.view==="appr"?approvals():matrix();
  if(S.view==="new"){renderRoute();renderChecks();
    ["dept","level"].forEach(id=>$("#"+id).addEventListener("change",renderRoute));
    $("#reqForm").addEventListener("input",e=>{renderChecks(); const f=e.target.closest(".f"); if(f&&e.target.value.trim()) f.classList.remove("err");});
    $("#reqForm").addEventListener("change",renderChecks);
    $("#reqForm").addEventListener("submit",submitForm);}
  if(S.view==="dash"){$("#q").addEventListener("input",e=>{S.q=e.target.value; const pos=e.target.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos);});}
  if(S.view==="matrix") ensureGsi();
}

document.addEventListener("click",e=>{
  const mxb=e.target.closest("[data-mx]"); if(mxb){ if(!mxb.disabled) mxAction(mxb.dataset.mx,mxb.dataset); return; }
  const g=e.target.closest("[data-go]"); if(g){ if(S.draft&&g.dataset.go!=="matrix"&&!confirm("You have unpublished matrix changes. Leave them as a draft and switch page?")) return;S.view=g.dataset.go;closeDrawer();render();$("main").scrollTop=0;return;}
  for(const k of ["approve","decline","post","nudge"]){const b=e.target.closest(`[data-${k}]`); if(b){if(!b.disabled) act(k,b.dataset[k]);return;}}
  const o=e.target.closest("[data-open]"); if(o){openDrawer(o.dataset.open);return;}
  const l=e.target.closest("[data-lane]"); if(l){const n=+l.dataset.lane; S.lane=S.lane===n?null:n; render(); return;}
  if(e.target.closest("[data-clearlane]")){S.lane=null;render();return;}
  const f=e.target.closest("[data-f]"); if(f){S.filter=f.dataset.f;render();return;}
  const p=e.target.closest("[data-p]"); if(p){const t=$("#just"); t.value=(t.value?t.value+"\n":"")+p.dataset.p+" "; t.focus(); t.dispatchEvent(new Event("input",{bubbles:true})); return;}
  if(e.target.id==="scrim"||e.target.closest("#closeD")) closeDrawer();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeDrawer();
  if(e.key==="Enter"){const t=e.target.closest("tr[data-open]"); if(t) t.click();}
});
$("#drawer").addEventListener("input",e=>{
  const p=S.mxPanel; if(!p) return; const t=e.target;
  if(t.dataset.ap!==undefined){ const i=+t.dataset.ap; p.chain[i]=t.value.trim().toLowerCase(); const h=$("#aph"+i), v=p.chain[i], prob=v?emailProblem(v):"Enter an email";
    if(h){h.classList.toggle("bad",!!prob); h.textContent=prob||nameOf(v);} }
});
$("#drawer").addEventListener("change",e=>{
  const p=S.mxPanel, t=e.target; if(!p||!t.dataset.also) return;
  const arr=t.dataset.also==="l"?p.alsoL:p.alsoD, v=+t.value, i=arr.indexOf(v);
  if(t.checked&&i<0) arr.push(v); if(!t.checked&&i>=0) arr.splice(i,1);
  const ok=$("#drawer [data-mx=cellok]"); if(ok){const n=p.alsoL.length+p.alsoD.length; ok.textContent=n?`Apply to ${1+n} cells`:"Apply";}
});
$("#viewer").addEventListener("change",e=>setViewer(e.target.value));
$("#reset").addEventListener("click",async()=>{
  if(!confirm("Reset to the sample requests? This replaces the current data for everyone.")) return;
  const fresh=seed();
  if(MODE==="live"){
    try{
      for(const r of S.reqs) if(!fresh.some(f=>f.id===r.id)) await DB.collection("requests").doc(r.id).delete();
      for(const r of fresh) await DB.collection("requests").doc(r.id).set(r);
      if(S.mx.src==="demo") await DB.doc("config/matrix").set(clone(DEFAULT_MATRIX));
    }catch(err){writeErr(err);return;}
  }else{S.reqs=fresh; if(S.mx.src==="demo"){S.matrix=clone(DEFAULT_MATRIX);S.mx.log=[];} S.draft=null; saveLocal();}
  S.lane=null;S.filter="all";closeDrawer();render();toast("Demo data reset");
});
render();
initData();
})();
</script>
</body>
</html>
